name: Daily NSE BSE EOD Data

on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "latest/**"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout collector
        uses: actions/checkout@v4

      - name: Collect NSE and BSE data
        run: python3 collector.py

      - name: Prepare latest data for ChatGPT
        shell: bash
        run: |
          set -e
          rm -rf latest
          mkdir -p latest
          DAY=$(ls -1d output/20*-*-* | sort | tail -1)
          echo "Selected folder: $DAY"
          if [ -f "$DAY/nse_udiff.zip" ]; then
            mkdir -p latest/_nse_udiff
            unzip -o "$DAY/nse_udiff.zip" -d latest/_nse_udiff >/dev/null
            find latest/_nse_udiff -type f -iname '*.csv' -print -quit | xargs -r -I{} cp "{}" latest/nse_udiff.csv
            rm -rf latest/_nse_udiff
          fi
          [ -f "$DAY/nse_full.csv" ] && cp "$DAY/nse_full.csv" latest/nse_full.csv || true
          [ -f "$DAY/nse_52w.csv" ] && cp "$DAY/nse_52w.csv" latest/nse_52w.csv || true
          [ -f "$DAY/nse_delivery.DAT" ] && cp "$DAY/nse_delivery.DAT" latest/nse_delivery.DAT || true
          [ -f "$DAY/nse_market_activity.csv" ] && cp "$DAY/nse_market_activity.csv" latest/nse_market_activity.csv || true
          [ -f "$DAY/nse_volatility.CSV" ] && cp "$DAY/nse_volatility.CSV" latest/nse_volatility.CSV || true
          [ -f "$DAY/nse_security.gz" ] && cp "$DAY/nse_security.gz" latest/nse_security.gz || true
          BSE_FILE=$(find "$DAY" -maxdepth 1 -type f -iname 'bse_equity_bhavcopy_*' | sort | head -1 || true)
          if [ -n "$BSE_FILE" ]; then
            case "$BSE_FILE" in
              *.zip|*.ZIP)
                mkdir -p latest/_bse
                unzip -o "$BSE_FILE" -d latest/_bse >/dev/null
                find latest/_bse -type f \( -iname '*.csv' -o -iname '*.CSV' \) -print -quit | xargs -r -I{} cp "{}" latest/bse_equity.csv
                rm -rf latest/_bse
                ;;
              *) cp "$BSE_FILE" latest/bse_equity.csv ;;
            esac
          fi
          cp "$DAY/manifest.json" latest/manifest.json
          printf 'Latest trading folder: %s\n' "$DAY" > latest/README.txt
          printf 'Source: official NSE/BSE exchange files collected by GitHub Actions.\n' >> latest/README.txt
          printf 'The latest directory is the machine-readable handoff for ChatGPT analysis.\n' >> latest/README.txt

      - name: Publish latest data to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest
          if git diff --cached --quiet; then
            echo "No latest-data changes to commit."
          else
            git commit -m "Update latest NSE BSE market data"
            git push
          fi

      - name: Upload daily bundle
        uses: actions/upload-artifact@v4
        with:
          name: nse-bse-daily-${{ github.run_id }}
          path: output/bundle_*.zip
          if-no-files-found: error
          retention-days: 14
