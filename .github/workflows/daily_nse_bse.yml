name: Daily NSE BSE EOD Data

on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout collector
        uses: actions/checkout@v4

      - name: Collect NSE and BSE data
        run: python3 collector.py

      - name: Upload daily bundle
        uses: actions/upload-artifact@v4
        with:
          name: nse-bse-daily-${{ github.run_id }}
          path: output/bundle_*.zip
          if-no-files-found: error
          retention-days: 14
